# Garde les deux versions du portfolio éveillées.
# Streamlit Community Cloud met une app en veille après environ 12 heures sans visite :
# ce robot ouvre chaque site toutes les 6 heures et clique sur le bouton de réveil s'il apparaît.
name: Réveil du portfolio

on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 heures (heure UTC)
  workflow_dispatch:          # bouton « Run workflow » pour le lancer à la main

jobs:
  reveil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer un navigateur automatique
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Ouvrir les deux sites
        run: |
          cat > reveil.py <<'EOF'
          from playwright.sync_api import sync_playwright

          SITES = [
              "https://salah-fetaissa.streamlit.app/",
              "https://salah-fetaissa-portfolio.streamlit.app/",
          ]

          with sync_playwright() as p:
              navigateur = p.chromium.launch()
              for url in SITES:
                  page = navigateur.new_page()
                  page.goto(url, wait_until="domcontentloaded", timeout=120_000)
                  page.wait_for_timeout(10_000)
                  bouton = page.get_by_role("button", name="Yes, get this app back up")
                  if bouton.count() > 0:
                      bouton.first.click()
                      print(url, ": en veille, réveil lancé")
                      page.wait_for_timeout(90_000)
                  else:
                      print(url, ": déjà éveillé")
                  page.close()
              navigateur.close()
          EOF
          python reveil.py
